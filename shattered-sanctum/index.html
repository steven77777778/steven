<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>破碎聖域 Shattered Sanctum</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #050506; color: #d8d2c4;
        font-family: "Noto Serif TC", "Georgia", serif; }
      #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #debug { position: absolute; top: 10px; left: 12px; font: 12px/1.5 ui-monospace, monospace;
        color: #b9c2b0; text-shadow: 0 1px 2px #000; white-space: pre; }
      #help { position: absolute; bottom: 12px; left: 12px; font-size: 13px; line-height: 1.6;
        color: #a8a294; text-shadow: 0 1px 2px #000; }
      #reticle { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; display: none;
        border: 2px solid #e8e2d0; border-radius: 50%; box-shadow: 0 0 8px #fff8, inset 0 0 4px #fff8; }
      #reticle::after { content: ""; position: absolute; inset: 4px; background: #fff; border-radius: 50%; }
      #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; background: #050506; transition: opacity .6s; z-index: 10; }
      #overlay h1 { font-weight: 400; letter-spacing: .4em; font-size: 28px; margin: 0 0 18px; }
      #overlay p { margin: 0; font-size: 14px; color: #8d877a; }
      #overlay.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="hud">
      <div id="debug"></div>
      <div id="reticle"></div>
      <div id="help">
        WASD 移動 ｜ 滑鼠 視角 ｜ Shift 點按閃避／按住奔跑 ｜ Space 跳躍<br />
        滑鼠中鍵／Tab 鎖定 ｜ 滾輪 切換目標 ｜ F2 Inspector ｜ 點擊畫面鎖定滑鼠<br />
        手把：左搖桿 移動 ｜ 右搖桿 視角 ｜ B 閃避／奔跑 ｜ A 跳躍 ｜ R3 鎖定 ｜ 右搖桿左右 切換目標
      </div>
    </div>
    <div id="overlay"><h1>破碎聖域</h1><p id="overlay-text">載入中…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
