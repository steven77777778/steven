name: MarsPet
options:
  bundleIdPrefix: com.marspet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  MarsPet:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: Plists/MarsPet.plist
      properties:
        CFBundleDisplayName: "\u3164"   # 看不見的空白字元：主畫面上 app 與小工具下方不顯示名稱
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marspet.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MarsPetWidget
  MarsPetWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Plists/MarsPetWidget.plist
      properties:
        CFBundleDisplayName: "\u3164"   # 看不見的空白字元：主畫面上 app 與小工具下方不顯示名稱
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marspet.app.widget
  # 第二隻桌寵：白色長耳。和火星人共用程式碼，但是獨立的 app（不同的識別碼，裝了不會蓋掉火星人）。
  Bunny:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: Plists/Bunny.plist
      properties:
        CFBundleDisplayName: "\u3164"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marspet.bunny
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconBunny
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BUNNY
    dependencies:
      - target: BunnyWidget
  BunnyWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Plists/BunnyWidget.plist
      properties:
        CFBundleDisplayName: "\u3164"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marspet.bunny.widget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: BUNNY
schemes:
  MarsPet:
    build:
      targets:
        MarsPet: all
  Bunny:
    build:
      targets:
        Bunny: all
