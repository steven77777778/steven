name: BMP decoder probe

on:
  push:
    paths:
      - "ios/probe/**"
      - ".github/workflows/bmp-probe.yml"

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 ios/probe/make_variants.py /tmp/variants
          cp ios/Shared/Sprites/pet-idle-0.bmp /tmp/variants/current_sprite.bmp
          swift ios/probe/probe.swift /tmp/variants
