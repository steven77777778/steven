name: Build iOS ipa

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26   # macos-15 的機器排隊太久，改用另一批較新的 Mac 機器
    steps:
      - uses: actions/checkout@v4

      - name: Check BMP images decode with transparency
        run: swift ios/verify_bmp.swift ios/Shared/Sprites

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned) — 火星人與白色長耳兩個 app
        working-directory: ios
        run: |
          set -o pipefail
          for scheme in MarsPet Bunny; do
            xcodebuild -project MarsPet.xcodeproj -scheme $scheme -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build | tail -n 120
          done

      - name: Package two ipa files
        working-directory: ios
        run: |
          for app in MarsPet Bunny; do
            rm -rf Payload && mkdir Payload
            cp -R build/Build/Products/Release-iphoneos/$app.app Payload/
            ls Payload/$app.app/PlugIns
            /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" Payload/$app.app/Info.plist
            zip -qry $app.ipa Payload
          done

      - uses: actions/upload-artifact@v4
        with:
          name: MarsPet-ipa
          path: ios/MarsPet.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Bunny-ipa
          path: ios/Bunny.ipa
