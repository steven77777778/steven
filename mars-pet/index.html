<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>火星人桌寵</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="火星人">
<meta name="theme-color" content="#141a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #141a33; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 14px);
    text-align: center; color: #fff; opacity: .9; text-shadow: 0 1px 3px #000, 0 0 8px #000; pointer-events: none;
    font: 13px/1.4 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; transition: opacity .6s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">點一下火星人，他會向你招手 · 按住可以拖著他走</div>
<script>
'use strict';
/* ---------- 像素造型（要換造型只需改這一段） ---------- */
const SW = 28, SH = 30;                       // 火星人的格數（寬 × 高）
const PALETTE = {
  o: '#1d2a2a',  // 外框
  g: '#7fd67a',  // 身體
  l: '#b4efa6',  // 亮面
  d: '#55ad5c',  // 暗面
  w: '#ffffff',  // 眼白
  k: '#1b1b2a',  // 瞳孔 / 嘴
  p: '#ff9db0',  // 腮紅
  y: '#ffd95a',  // 觸角球
  r: '#e8566a'   // 張開的嘴
};

// opts: {up: 頭部上移一格, blink: 眨眼, arm: 0 放下 / 1,2,3 招手三個位置, smile: 張嘴笑}
function buildSprite(opts) {
  const g = Array.from({ length: SH }, () => Array(SW).fill('.'));
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < SW && y < SH) g[y][x] = c; };
  const rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, c); };
  const ellipse = (cx, cy, rx, ry, c) => {
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) set(x, y, c);
    }
  };
  const line = (x0, y0, x1, y1, c, thick) => {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let i = 0; i <= n; i++) {
      const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
      set(x, y, c); if (thick) set(x + 1, y, c);
    }
  };
  const hy = opts.up ? -1 : 0;                // 頭部位移

  // 腳
  rect(8, 26, 3, 2, 'd'); rect(15, 26, 3, 2, 'd');
  // 身體
  ellipse(13, 21.5, 5, 5.2, 'g');
  rect(10, 23, 6, 2, 'd'); ellipse(13, 20.5, 4.6, 4.2, 'g');
  // 觸角
  line(9, 5 + hy, 7, 2 + hy, 'g'); line(16, 5 + hy, 18, 2 + hy, 'g');
  rect(6, 1 + hy, 2, 2, 'y'); rect(18, 1 + hy, 2, 2, 'y');
  // 頭
  ellipse(13, 11 + hy, 8, 6.4, 'g');
  ellipse(10.5, 7.6 + hy, 3, 1.4, 'l');       // 亮面
  // 左手（畫面左側）自然垂下
  line(7, 19, 5, 22, 'g', true);
  // 右手（畫面右側）— 招手用
  if (!opts.arm) line(18, 19, 20, 22, 'g', true);
  else {
    const hand = [[24, 9], [25, 11], [22, 8]][opts.arm - 1];
    line(18, 19, hand[0] - 1, hand[1] + 1, 'g', true);
    rect(hand[0] - 1, hand[1] - 1, 3, 3, 'l');
  }
  // 眼睛
  if (opts.blink) { rect(7, 12 + hy, 4, 1, 'k'); rect(15, 12 + hy, 4, 1, 'k'); }
  else {
    rect(7, 10 + hy, 4, 4, 'w'); rect(15, 10 + hy, 4, 4, 'w');
    rect(8, 11 + hy, 2, 2, 'k'); rect(16, 11 + hy, 2, 2, 'k');
  }
  // 腮紅與嘴
  rect(6, 14 + hy, 2, 1, 'p'); rect(18, 14 + hy, 2, 1, 'p');
  if (opts.smile) { rect(12, 14 + hy, 2, 2, 'r'); }
  else rect(12, 15 + hy, 2, 1, 'k');

  // 自動描外框
  const out = g.map(r => r.slice());
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
    if (g[y][x] !== '.') continue;
    const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => {
      const c = g[y + b] && g[y + b][x + a]; return c && c !== '.';
    });
    if (n) out[y][x] = 'o';
  }
  return out;
}

/* ---------- 馬賽克磚繪製 ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let T = 12, cols = 0, rows = 0, W = 0, H = 0, dpr = 1;
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function tile(c, x, y, t, color, seedX, seedY) {
  const gap = Math.max(1, t * .09), s = t - gap, r = s * .18, px = x + gap / 2, py = y + gap / 2;
  c.fillStyle = shade(color, .9 + hash(seedX, seedY) * .2);
  c.beginPath(); c.roundRect(px, py, s, s, r); c.fill();
  c.fillStyle = 'rgba(255,255,255,.16)';        // 上緣反光
  c.beginPath(); c.roundRect(px, py, s, s * .3, r); c.fill();
  c.fillStyle = 'rgba(0,0,0,.12)';              // 下緣陰影
  c.beginPath(); c.roundRect(px, py + s * .78, s, s * .22, r); c.fill();
}
function bgColor(x, y) {
  const h = hash(x + 91, y + 17);
  if (y >= rows - floorRows) return h > .5 ? '#b5563f' : '#a34a38';   // 火星地面
  if (h > .985) return '#ffe9a8';                                      // 星星
  if (h > .97) return '#8fa3ff';
  return ['#1b2347', '#1f2850', '#232d5a', '#1a2143'][Math.floor(h * 400) % 4];
}
let floorRows = 4, bg = null;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  T = Math.max(6, Math.floor(Math.min(W / (SW + 4), H / (SH + 12))));
  cols = Math.ceil(W / T); rows = Math.ceil(H / T);
  floorRows = Math.max(3, Math.round(rows * .14));
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d'); b.scale(dpr, dpr);
  b.fillStyle = '#0c1024'; b.fillRect(0, 0, W, H);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) tile(b, x * T, y * T, T, bgColor(x, y), x, y);
  pet.x = Math.max(0, Math.min(cols - SW, pet.x ?? Math.round((cols - SW) / 2)));
  pet.y = groundY();
  dirty = true;
}
const groundY = () => rows - floorRows - SH + 2;

/* ---------- 狀態與動畫 ---------- */
const pet = { x: null, y: 0, up: false, blink: false, arm: 0, waveUntil: 0, drag: null };
let dirty = true;
function draw() {
  if (!dirty) return; dirty = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const waving = pet.arm > 0;
  const sp = buildSprite({ up: pet.up, blink: pet.blink && !waving, arm: pet.arm, smile: waving });
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
    const ch = sp[y][x]; if (ch === '.') continue;
    tile(ctx, (pet.x + x) * T, (pet.y + y) * T, T, PALETTE[ch], x + 500, y + 500);
  }
}
function wave() {
  pet.waveUntil = performance.now() + 2200;
  document.getElementById('hint').style.opacity = 0;
}
let last = { bob: 0, blink: 0, wave: 0 }, nextBlink = 2500;
function tick(now) {
  if (now - last.bob > 650) { last.bob = now; pet.up = !pet.up; dirty = true; }
  if (!pet.blink && now - last.blink > nextBlink) { pet.blink = true; last.blink = now; dirty = true; }
  else if (pet.blink && now - last.blink > 160) { pet.blink = false; last.blink = now; nextBlink = 1800 + Math.random() * 3500; dirty = true; }
  if (now < pet.waveUntil) {
    if (now - last.wave > 170) { last.wave = now; pet.arm = pet.arm === 1 ? 2 : pet.arm === 2 ? 3 : 1; dirty = true; }
  } else if (pet.arm) { pet.arm = 0; dirty = true; }
  // 放開後落回地面
  if (!pet.drag && pet.y !== groundY() && now - (pet.fallAt || 0) > 28) {
    pet.fallAt = now; pet.y += pet.y < groundY() ? 1 : -1; dirty = true;
  }
  draw(); requestAnimationFrame(tick);
}

/* ---------- 觸控：點擊招手、拖曳移動 ---------- */
const hit = (px, py) => {
  const tx = px / T - pet.x, ty = py / T - pet.y;
  return tx >= 2 && tx < SW - 1 && ty >= 0 && ty < SH - 1;
};
cv.addEventListener('pointerdown', e => {
  if (!hit(e.clientX, e.clientY)) return;
  cv.setPointerCapture(e.pointerId);
  pet.drag = { sx: e.clientX, sy: e.clientY, ox: pet.x, oy: pet.y, moved: false };
});
cv.addEventListener('pointermove', e => {
  const d = pet.drag; if (!d) return;
  const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
  if (!d.moved && Math.hypot(dx, dy) < 10) return;
  d.moved = true;
  pet.x = Math.max(-4, Math.min(cols - SW + 4, d.ox + Math.round(dx / T)));
  pet.y = Math.max(0, Math.min(groundY(), d.oy + Math.round(dy / T)));
  dirty = true;
});
const end = () => { const d = pet.drag; if (!d) return; pet.drag = null; if (!d.moved) wave(); };
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', () => { pet.drag = null; });
window.addEventListener('resize', resize);

// 產生 App 圖示用（開發時呼叫）
window.renderIcon = size => {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'), n = SH + 4, t = size / n, sp = buildSprite({ arm: 1, smile: true });
  x.fillStyle = '#0c1024'; x.fillRect(0, 0, size, size);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) tile(x, i * t, j * t, t, j >= n - 3 ? '#a34a38' : '#1f2850', i, j);
  for (let j = 0; j < SH; j++) for (let i = 0; i < SW; i++) if (sp[j][i] !== '.') tile(x, (i + 3) * t, (j + 3) * t, t, PALETTE[sp[j][i]], i + 500, j + 500);
  return c.toDataURL('image/png');
};

resize(); requestAnimationFrame(tick);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
