<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>火星人桌寵</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="火星人">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 14px);
    text-align: center; color: #fff; opacity: .9; text-shadow: 0 1px 3px #000, 0 0 8px #000; pointer-events: none;
    font: 13px/1.4 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; transition: opacity .6s;
  }
  #float {
    position: fixed; right: 14px; top: calc(env(safe-area-inset-top) + 14px);
    padding: 9px 16px; border: 1px solid #555; border-radius: 999px; background: #1c1c1e; color: #fff;
    font: 600 15px/1 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; touch-action: manipulation;
  }
  #float:active { background: #333; }
  #pip { position: fixed; left: 0; bottom: 0; width: 37px; height: 55px; opacity: .01; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="float">懸浮</button>
<video id="pip" src="float.mp4" loop muted playsinline preload="auto"></video>
<div id="hint">點一下火星人，他會向你招手 · 按住可以拖著他走</div>
<script>
'use strict';
/* ---------- 像素造型（要換造型只需改這一段） ---------- */
const SW = 27, SH = 42;                       // 火星人的格數（寬 × 高）
const PALETTE = {
  o: '#191a26',  // 外框
  r: '#d8434a',  // 章魚頭
  R: '#ea6b6f',  // 頭部亮面
  D: '#b8353d',  // 觸手暗面
  w: '#ffffff',  // 眼白
  k: '#26262c',  // 瞳孔 / 鞋子
  c: '#f4e8d6',  // 米白毛衣
  C: '#e0d0b8',  // 毛衣陰影
  s: '#f6c9b0',  // 手
  b: '#2c6c8c',  // 牛仔褲
  B: '#1f5370'   // 牛仔褲陰影
};

// opts: {up: 頭部上移一格, blink: 眨眼, arm: 0 放下 / 1,2,3 招手三個位置}
function buildSprite(opts) {
  const g = Array.from({ length: SH }, () => Array(SW).fill('.'));
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < SW && y < SH) g[y][x] = c; };
  const rect = (x, y, w, h, c) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, c); };
  const ellipse = (cx, cy, rx, ry, c) => {
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
      const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) set(x, y, c);
    }
  };
  const line = (x0, y0, x1, y1, c) => {         // 兩格粗的線
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let i = 0; i <= n; i++) {
      const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
      set(x, y, c); set(x + 1, y, c);
    }
  };
  const hy = opts.up ? -1 : 0;                // 頭部位移

  // 鞋子與牛仔褲
  rect(9, 39, 3, 2, 'k'); rect(14, 39, 3, 2, 'k');
  rect(9, 27, 8, 12, 'b'); rect(12, 30, 2, 9, 'B'); rect(9, 37, 1, 2, 'B'); rect(16, 37, 1, 2, 'B');
  // 毛衣
  rect(8, 14, 10, 3, 'c'); rect(9, 17, 8, 10, 'c'); rect(9, 26, 8, 1, 'C');
  // 左手（畫面左側）自然垂下
  if (!opts.dance) { rect(6, 15, 2, 13, 'c'); rect(7, 17, 1, 10, 'C'); rect(6, 28, 2, 2, 's'); }
  // 右手放下
  if (!opts.arm && !opts.dance) { rect(18, 15, 2, 13, 'c'); rect(18, 17, 1, 10, 'C'); rect(18, 28, 2, 2, 's'); }
  // 章魚頭
  ellipse(13, 7.5 + hy, 6.2, 6.6, 'r');
  ellipse(10.5, 3.6 + hy, 2.4, 1.3, 'R');
  // 觸手：外側往旁邊翹，內側垂在胸前
  line(7, 12 + hy, 4, 15 + hy, 'r'); line(17, 12 + hy, 20, 15 + hy, 'r');
  line(9, 13 + hy, 8, 18 + hy, 'r'); line(15, 13 + hy, 16, 18 + hy, 'r');
  line(12, 13 + hy, 12, 20 + hy, 'r');
  rect(8, 18 + hy, 2, 1, 'D'); rect(16, 18 + hy, 2, 1, 'D'); rect(12, 20 + hy, 2, 1, 'D');
  rect(4, 15 + hy, 2, 1, 'D'); rect(20, 15 + hy, 2, 1, 'D');
  // 眼睛：白色橢圓加一小道黑瞳孔
  for (const ex of [8, 14]) {
    if (opts.blink) rect(ex, 7 + hy, 4, 1, 'k');
    else { rect(ex + 1, 6 + hy, 2, 1, 'w'); rect(ex, 7 + hy, 4, 1, 'w'); rect(ex + 1, 8 + hy, 2, 1, 'w'); rect(ex + 1, 7 + hy, 2, 1, 'k'); }
  }
  // 右手舉起來招手
  if (opts.arm) {
    const hand = [[23, 8], [24, 10], [22, 7]][opts.arm - 1];
    line(18, 16, hand[0] - 1, hand[1] + 2, 'c');
    rect(hand[0] - 1, hand[1] - 1, 3, 3, 's');
  }
  // 跳舞：右手斜斜高舉，左手彎在胸前，身體微微向左傾（opts.dance = 1 或 2 兩個姿勢）
  if (opts.dance) {
    const d = opts.dance - 1;
    line(18, 16, 22 - d, 6 + d, 'c'); rect(22 - d, 3 + d, 3, 3, 's');
    rect(6, 15, 2, 7, 'c');
    line(7, 20, 13, 18, 'o'); line(7, 23, 13, 21, 'o');
    line(7, 21, 13, 19, 'c'); line(7, 22, 13, 20, 'c');
    rect(14, 18, 2, 3, 's');
    // 傾斜：越高的列往左移越多，腳留在原地
    // 脖子以上再多傾一些，讓頭也跟著歪過去
    const k = d ? 3 : 4, head = d ? 3 : 4;
    for (let y = 0; y < SH; y++) {
      const sft = Math.round((SH - 3 - y) / SH * k + Math.max(0, 16 - y) / 16 * head);
      if (sft > 0) g[y] = g[y].slice(sft).concat(Array(sft).fill('.'));
    }
  }

  // 自動描外框
  const out = g.map(r => r.slice());
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
    if (g[y][x] !== '.') continue;
    const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => {
      const c = g[y + b] && g[y + b][x + a]; return c && c !== '.';
    });
    if (n) out[y][x] = 'o';
  }
  return out;
}

/* ---------- 馬賽克磚繪製 ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let T = 12, cols = 0, rows = 0, W = 0, H = 0, dpr = 1;
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function tile(c, x, y, t, color, seedX, seedY) {
  const gap = Math.max(1, t * .09), s = t - gap, r = s * .18, px = x + gap / 2, py = y + gap / 2;
  c.fillStyle = shade(color, .9 + hash(seedX, seedY) * .2);
  c.beginPath(); c.roundRect(px, py, s, s, r); c.fill();
  c.fillStyle = 'rgba(255,255,255,.16)';        // 上緣反光
  c.beginPath(); c.roundRect(px, py, s, s * .3, r); c.fill();
  c.fillStyle = 'rgba(0,0,0,.12)';              // 下緣陰影
  c.beginPath(); c.roundRect(px, py + s * .78, s, s * .22, r); c.fill();
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  T = Math.max(5, Math.floor(Math.min(W / (SW + 3), H / (SH + 14))));
  cols = Math.ceil(W / T); rows = Math.ceil(H / T);
  pet.x = Math.max(0, Math.min(cols - SW, pet.x ?? Math.round((cols - SW) / 2)));
  pet.y = groundY();
  dirty = true;
}
const groundY = () => Math.max(0, rows - SH - 4);

/* ---------- 狀態與動畫 ---------- */
const pet = { x: null, y: 0, up: false, blink: false, arm: 0, waveUntil: 0, drag: null };
let dirty = true;
function draw() {
  if (!dirty) return; dirty = false;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);   // 去背：只畫角色
  const waving = pet.arm > 0;
  const sp = buildSprite({ up: pet.up, blink: pet.blink && !waving, arm: pet.arm });
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
    const ch = sp[y][x]; if (ch === '.') continue;
    tile(ctx, (pet.x + x) * T, (pet.y + y) * T, T, PALETTE[ch], x + 500, y + 500);
  }
}
function wave() {
  pet.waveUntil = performance.now() + 2200;
  document.getElementById('hint').style.opacity = 0;
}
let last = { bob: 0, blink: 0, wave: 0 }, nextBlink = 2500;
function tick(now) {
  if (now - last.bob > 650) { last.bob = now; pet.up = !pet.up; dirty = true; }
  if (!pet.blink && now - last.blink > nextBlink) { pet.blink = true; last.blink = now; dirty = true; }
  else if (pet.blink && now - last.blink > 160) { pet.blink = false; last.blink = now; nextBlink = 1800 + Math.random() * 3500; dirty = true; }
  if (now < pet.waveUntil) {
    if (now - last.wave > 170) { last.wave = now; pet.arm = pet.arm === 1 ? 2 : pet.arm === 2 ? 3 : 1; dirty = true; }
  } else if (pet.arm) { pet.arm = 0; dirty = true; }
  // 放開後落回地面
  if (!pet.drag && pet.y !== groundY() && now - (pet.fallAt || 0) > 28) {
    pet.fallAt = now; pet.y += pet.y < groundY() ? 1 : -1; dirty = true;
  }
  draw(); requestAnimationFrame(tick);
}

/* ---------- 觸控：點擊招手、拖曳移動 ---------- */
const hit = (px, py) => {
  const tx = px / T - pet.x, ty = py / T - pet.y;
  return tx >= 2 && tx < SW && ty >= 0 && ty < SH;
};
cv.addEventListener('pointerdown', e => {
  if (!hit(e.clientX, e.clientY)) return;
  cv.setPointerCapture(e.pointerId);
  pet.drag = { sx: e.clientX, sy: e.clientY, ox: pet.x, oy: pet.y, moved: false };
});
cv.addEventListener('pointermove', e => {
  const d = pet.drag; if (!d) return;
  const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
  if (!d.moved && Math.hypot(dx, dy) < 10) return;
  d.moved = true;
  pet.x = Math.max(-4, Math.min(cols - SW + 4, d.ox + Math.round(dx / T)));
  pet.y = Math.max(0, Math.min(groundY(), d.oy + Math.round(dy / T)));
  dirty = true;
});
const end = () => { const d = pet.drag; if (!d) return; pet.drag = null; if (!d.moved) wave(); };
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', () => { pet.drag = null; });
window.addEventListener('resize', resize);

// 匯出去背 PNG（開發時呼叫）
window.renderPng = (opts, t) => {
  const c = document.createElement('canvas'); c.width = SW * t; c.height = SH * t;
  const x = c.getContext('2d'), sp = buildSprite(opts);
  for (let j = 0; j < SH; j++) for (let i = 0; i < SW; i++) if (sp[j][i] !== '.') tile(x, i * t, j * t, t, PALETTE[sp[j][i]], i + 500, j + 500);
  return c.toDataURL('image/png');
};
// 產生 App 圖示用（開發時呼叫）
window.renderIcon = size => {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'), n = 26, t = size / n, sp = buildSprite({ arm: 1 });
  x.fillStyle = '#0c1024'; x.fillRect(0, 0, size, size);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) tile(x, i * t, j * t, t, '#1f2850', i, j);
  for (let j = 0; j < SH; j++) for (let i = 0; i < SW; i++) if (sp[j][i] !== '.' && j + 3 < n) tile(x, (i - 1) * t, (j + 3) * t, t, PALETTE[sp[j][i]], i + 500, j + 500);
  return c.toDataURL('image/png');
};

/* ---------- 懸浮：用子母畫面讓他浮在主畫面與其他 app 上 ---------- */
const pip = document.getElementById('pip'), hint = document.getElementById('hint');
const say = t => { hint.textContent = t; hint.style.opacity = .9; };
document.getElementById('float').addEventListener('click', async () => {
  try {
    await pip.play();
    if (pip.webkitSupportsPresentationMode && pip.webkitSupportsPresentationMode('picture-in-picture')) {
      const on = pip.webkitPresentationMode === 'picture-in-picture';
      pip.webkitSetPresentationMode(on ? 'inline' : 'picture-in-picture');
      if (!on) say('已懸浮：回到主畫面他也會跟著你，每隔幾秒招手一次');
    } else if (document.pictureInPictureEnabled) {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else { await pip.requestPictureInPicture(); say('已懸浮：每隔幾秒招手一次'); }
    } else say('這個瀏覽器不支援懸浮，請改用 Safari 開啟網頁再試');
  } catch (e) { say('懸浮失敗：' + (e && e.message || e)); }
});

resize(); requestAnimationFrame(tick);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
